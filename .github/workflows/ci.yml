name: Windows regression

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check public source
        run: ./tools/check-source.ps1
      - name: Build and run offline regression
        run: ./tests/run.ps1 -OutputDirectory "$env:RUNNER_TEMP/regression"
      - name: Prepare portable package from tested binary
        run: ./tools/package.ps1 -OutputDirectory "$env:RUNNER_TEMP/packages" -ExecutablePath "$env:RUNNER_TEMP/regression/bin/CodexUsageFloat.exe"
      - name: Verify clean source archive
        run: |
          Expand-Archive -LiteralPath "$env:RUNNER_TEMP/packages/CodexUsageFloat-source.zip" -DestinationPath "$env:RUNNER_TEMP/clean-source"
          & "$env:RUNNER_TEMP/clean-source/tools/check-source.ps1"
          & "$env:RUNNER_TEMP/clean-source/tests/run.ps1" -OutputDirectory "$env:RUNNER_TEMP/package-regression"
      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: regression-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/regression/results.json
            ${{ runner.temp }}/regression/stdout.txt
            ${{ runner.temp }}/regression/stderr.txt
            ${{ runner.temp }}/regression/circle-example.png
            ${{ runner.temp }}/package-regression/results.json
            ${{ runner.temp }}/package-regression/stdout.txt
            ${{ runner.temp }}/package-regression/stderr.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Upload portable and source packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.os }}
          path: ${{ runner.temp }}/packages/*.zip
          if-no-files-found: error
          retention-days: 14
